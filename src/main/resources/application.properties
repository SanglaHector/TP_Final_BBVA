spring.application.name=CatalogoDeCamisetasV2

# Configuracion de la base de datos JSON
# Directorio donde se almacenaran los archivos JSON
# app.json-db.path=data
spring.mongodb.uri=mongodb+srv://hectorargentinosangla_db_user:pass@catalogocamisetas.ir6bex6.mongodb.net
spring.mongodb.database=tienda_camisetas
spring.thymeleaf.check-template-location=false

# ===== Configuracion de Logging =====
# Nivel de logging global (DEBUG, INFO, WARN, ERROR)
logging.level.root=DEBUG

# Logging para componentes especificos
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.example.catalogodecamisetasv2=DEBUG
logging.level.org.mongodb=INFO

# Configuracion de archivos de log
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]) %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
